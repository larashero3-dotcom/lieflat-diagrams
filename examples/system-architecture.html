<style>
:root{--paper:#F0EFEB;--ink:#58402E;--gray:#43593B;--muted:#77835A;--faint:rgba(88,64,46,.32);--grid:rgba(88,64,46,.16);--gold:#D4A017;--line-main:#77835A;--line-secondary:rgba(119,131,90,.78);--line-rule:rgba(119,131,90,.38);--line-grid:rgba(119,131,90,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter Tight',Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}.wrap{max-width:1280px;padding:72px 40px 30px;margin:auto}.hero{padding:0 20px}.hero h1{font-family:Georgia,serif;font-size:30px;font-weight:400;letter-spacing:.08em;margin:0 0 15px}.hero p{font-size:12px;color:var(--gray);margin:0;letter-spacing:.04em}.index{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px;margin:34px 20px 64px;padding:21px 0;border-top:.7px solid var(--faint)}a{color:inherit;text-decoration:none}.index-group{display:flex;flex-direction:column;gap:11px}.index-group h3{font-family:Georgia,serif;font-size:11px;font-weight:400;letter-spacing:.08em;margin:0 0 7px;color:var(--gray)}.index a{font-size:11px;display:flex;gap:12px;align-items:baseline}.num{font-family:'Inter Tight',sans-serif;font-size:10px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}.card{margin:0 0 46px;scroll-margin-top:24px}.card-head{display:flex;align-items:center;justify-content:space-between;margin:0 20px}.card h2{font-family:Georgia,serif;display:flex;gap:18px;align-items:center;font-size:13px;font-weight:400;letter-spacing:.08em;margin:0}.replay{font:400 10px 'Inter Tight',Arial,sans-serif;color:var(--gray);border:0;border-bottom:.6px solid var(--faint);padding:8px 2px;background:none;cursor:pointer;min-width:42px;min-height:32px}.replay:hover{color:var(--ink);border-color:var(--ink)}:focus-visible{outline:1px solid var(--gray);outline-offset:5px}.canvas{max-width:100%;overflow-x:auto;overflow-y:hidden;margin-top:24px;scrollbar-width:thin;scrollbar-color:var(--faint) var(--paper)}svg{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible}svg text{font-family:'Inter Tight',Arial,sans-serif;font-size:12px;font-weight:400;fill:var(--ink);text-anchor:middle}svg .small{font-size:10px;fill:var(--gray)}svg .section-label{font-family:Georgia,serif;font-size:13px;font-weight:400;text-anchor:start}svg .left{text-anchor:start}svg .end{text-anchor:end}svg .field{font-size:11px}svg .index-label{font-family:'Inter Tight',sans-serif;font-size:10px;fill:var(--muted)}svg .edge,svg .boundary,svg .shape{fill:none;stroke:var(--line-main);stroke-width:1.26;stroke-linecap:round;stroke-linejoin:round}.edge{marker-end:var(--arrow)}svg .boundary{stroke:var(--line-rule)}svg .light{stroke:var(--line-grid)}svg .strong{stroke:var(--line-main)}svg .inverse{fill:var(--ink)}
/* Frosted materials live below the SVG. No ancestor opacity/filter: backdrop
   samples the scene itself; typography and routes are never filtered. */

   before scene boundaries; no rectangular scene fill or tinted page overlay. */
.scene{position:relative;min-width:1120px;--scene-light:
 radial-gradient(ellipse 27% 42% at 32% 37%,rgba(172,173,121,.24),transparent 100%),

 radial-gradient(ellipse 7% 51% at 46% 45%,rgba(255,255,255,.68),transparent 100%);
 background-image:var(--scene-light)}
#architecture .scene{--scene-light:
 radial-gradient(ellipse 19% 43% at 15% 37%,rgba(172,173,121,.22),transparent 100%),
 radial-gradient(ellipse 25% 43% at 46% 50%,rgba(67,89,59,.19),transparent 100%),
 radial-gradient(ellipse 17% 44% at 86% 48%,rgba(119,131,90,.22),transparent 100%),
 radial-gradient(ellipse 8% 45% at 62% 47%,rgba(242,209,126,.13),transparent 100%),
 radial-gradient(ellipse 6% 48% at 36% 45%,rgba(255,255,255,.65),transparent 100%)}
#blueprint .scene{--scene-light:
 radial-gradient(ellipse 35% 20% at 50% 28%,rgba(172,173,121,.22),transparent 100%),
 radial-gradient(ellipse 33% 24% at 53% 70%,rgba(67,89,59,.16),transparent 100%),
 radial-gradient(ellipse 16% 16% at 67% 65%,rgba(242,209,126,.14),transparent 100%)}

.pane{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border-radius:var(--r,18px);
 background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(119,131,90,.04) 62%,rgba(255,255,255,.10));
 border:1px solid rgba(255,255,255,.66);box-shadow:inset 0 -1px 0 rgba(67,89,59,.10),0 5px 13px -9px rgba(67,89,59,.16);
 backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.pane::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(132deg,rgba(255,255,255,.88),rgba(119,131,90,.19) 43%,rgba(255,255,255,.30) 70%,rgba(67,89,59,.28));
 -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pane.front{background:linear-gradient(130deg,rgba(255,255,255,.14),rgba(172,173,121,.10))}
.pane.compute{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(67,89,59,.08))}
.pane.store{background:linear-gradient(130deg,rgba(255,255,255,.16),rgba(119,131,90,.08))}
.pane.inset{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(172,173,121,.06))}
.pane.compute.inset{background:linear-gradient(135deg,rgba(67,89,59,.10),rgba(119,131,90,.06));border-color:rgba(67,89,59,.22)}

/* Liquid material: static edge-refraction approximation, not physical rendering.
   Only a duplicate of the diagram's background is displaced. SVG ink stays above
   and outside all filters. The ring clips displacement to a narrow 7px edge. */
.pane{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
 background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(119,131,90,.025));
 border-color:rgba(255,255,255,.78);
 box-shadow:inset 1px 2px 1px rgba(255,255,255,.88),inset -1px -2px 1px rgba(67,89,59,.22),0 5px 10px -8px rgba(67,89,59,.25)}
.pane.front{background:linear-gradient(130deg,rgba(255,255,255,.10),rgba(172,173,121,.06))}

.pane.compute.inset{background:linear-gradient(135deg,rgba(67,89,59,.06),rgba(119,131,90,.04))}

.pane.gold::after{background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(212,160,23,.45) 46%,rgba(255,255,255,.90) 73%,rgba(212,160,23,.30))}
.refraction-ring{position:absolute;inset:0;border-radius:inherit;padding:7px;overflow:hidden;
 -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.refraction-field{position:absolute;background-color:var(--paper);background-image:var(--scene-light);filter:url(#palm-edge-refraction)}
@media(max-width:700px){.refraction-ring{display:none}.pane{backdrop-filter:none;-webkit-backdrop-filter:none}}
@supports not (mask-composite:exclude){.refraction-ring{display:none}}

/* Material coverage includes line-led diagrams. These are existing scopes and
   peer annotations, never a generic glass card wrapped around the whole chart. */
.pane.round{border-radius:50%;background:radial-gradient(ellipse at 28% 20%,rgba(255,255,255,.30),rgba(255,255,255,.04) 47%,rgba(119,131,90,.09) 83%,rgba(255,255,255,.17));
 box-shadow:inset 2px 3px 2px rgba(255,255,255,.90),inset -2px -3px 2px rgba(67,89,59,.18),0 7px 15px -12px rgba(67,89,59,.25)}

/* These set/use-case surfaces stay below SVG ink.

<script>
/* Static SVG is the baseline. WAAPI only changes opacity/dash offset, never geometry.
   Scoped cancellation replaces the token's timer registry; no animation loops. */
(() => {
  'use strict';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const cards = [...document.querySelectorAll('.card')];
  const states = new Map(cards.map(card => [card, {animations: [], seen: false}]));
  const finish = card => {
    const state = states.get(card);
    state.animations.forEach(animation => animation.cancel());
    state.animations = [];
    card.dataset.motion = 'static';
  };
  const play = card => {
    finish(card);
    const state = states.get(card);
    state.seen = true;
    if (reduced.matches || document.hidden || !Element.prototype.animate) return;
    card.dataset.motion = 'playing';
    card.querySelectorAll('[data-at]').forEach(element => {
      const delay = Number(element.dataset.at);
      let frames;
      let duration;
      if (element.matches('[data-draw]') && element instanceof SVGGeometryElement) {
        const length = element.getTotalLength();
        frames = [{strokeDasharray: `${length} ${length}`, strokeDashoffset: length, opacity: 0},
                  {strokeDasharray: `${length} ${length}`, strokeDashoffset: length, opacity: 1, offset: .035},
                  {strokeDasharray: `${length} ${length}`, strokeDashoffset: 0, opacity: 1}];
        duration = 650;
      } else {
        frames = [{opacity: 0}, {opacity: 1}];
        duration = 360;
      }
      state.animations.push(element.animate(frames, {duration, delay, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both'}));
    });
    const current = state.animations.slice();
    Promise.all(current.map(animation => animation.finished.catch(() => null))).then(() => {
      if (state.animations.length && state.animations[0] === current[0]) finish(card);
    });
  };
  cards.forEach(card => card.querySelector('.replay').addEventListener('click', () => play(card)));
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const state = states.get(entry.target);
        if (entry.isIntersecting && !state.seen) play(entry.target);
        else if (!entry.isIntersecting) finish(entry.target);
      });
    }, {threshold: .15});
    cards.forEach(card => observer.observe(card));
    window.addEventListener('pagehide', () => {observer.disconnect(); cards.forEach(finish);}, {once: true});
  }
  // Catch rapid leave/re-enter sequences even when the observer coalesces both scrolls.
  document.addEventListener('scroll', () => cards.forEach(card => {
    const rect = card.getBoundingClientRect();
    if (rect.bottom <= 0 || rect.top >= innerHeight) finish(card);
  }), {passive: true});
  document.addEventListener('visibilitychange', () => {if (document.hidden) cards.forEach(finish);});
  window.addEventListener('resize', () => cards.forEach(finish), {passive: true});
  reduced.addEventListener('change', () => cards.forEach(finish));
  window.addEventListener('pageshow', event => {if (event.persisted) cards.forEach(finish);});
})();

/* Refraction is allocated only around the viewport. CSS glass is the baseline.
   One shared filter; cropped background copies are removed offscreen. No RAF loop. */
(() => {
 'use strict';
 const mobile=matchMedia('(max-width:700px)'), reduced=matchMedia('(prefers-reduced-motion:reduce)');
 const scenes=[...document.querySelectorAll('.scene')], active=new Set(), pairs=new Map();
 const clear=scene=>{(pairs.get(scene)||[]).forEach(({ring})=>ring.remove());pairs.delete(scene);};
 const update=scene=>{
  if(!active.has(scene)||mobile.matches||reduced.matches||document.hidden){clear(scene);return;}
  const width=scene.clientWidth,height=scene.clientHeight;if(!width||!height)return;
  let rows=pairs.get(scene);
  if(!rows){rows=[...scene.querySelectorAll('.pane')].map(pane=>{
   const ring=document.createElement('div');ring.className='refraction-ring';
   const field=document.createElement('div');field.className='refraction-field';
   ring.append(field);pane.prepend(ring);return {pane,ring,field};
  });pairs.set(scene,rows);}
  rows.forEach(({pane,field})=>{const bleed=16;
   field.style.cssText=`left:${-bleed}px;top:${-bleed}px;width:${pane.clientWidth+2*bleed}px;height:${pane.clientHeight+2*bleed}px;background-size:${width}px ${height}px;background-position:${bleed-pane.offsetLeft-pane.clientLeft}px ${bleed-pane.offsetTop-pane.clientTop}px`;
  });
 };
 const refresh=()=>active.forEach(update);
 const resize='ResizeObserver' in window?new ResizeObserver(entries=>entries.forEach(({target})=>{if(active.has(target))update(target);})):null;
 const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>entries.forEach(entry=>{
  if(entry.isIntersecting){active.add(entry.target);resize?.observe(entry.target);update(entry.target);}
  else{active.delete(entry.target);resize?.unobserve(entry.target);clear(entry.target);}
 }),{rootMargin:'100px 0px',threshold:0}):null;
 scenes.forEach(scene=>observer?.observe(scene));
 window.addEventListener('resize',refresh,{passive:true});
 mobile.addEventListener('change',refresh);reduced.addEventListener('change',refresh);
 document.addEventListener('visibilitychange',()=>document.hidden?scenes.forEach(clear):refresh());
 window.addEventListener('pagehide',()=>{observer?.disconnect();resize?.disconnect();scenes.forEach(clear);active.clear();});
 window.addEventListener('pageshow',event=>{if(event.persisted)scenes.forEach(scene=>observer?.observe(scene));});
})();
</script>
</body>
